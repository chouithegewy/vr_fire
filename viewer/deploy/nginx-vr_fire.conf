    # vr_fire: static wasm app (precompressed) + multiplayer relay
    location /vr_fire/ws {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /vr_fire/ {
        gzip_static always;
        gunzip on;
        add_header Cache-Control "no-cache";
    }


    # vr_fire: LANDFIRE FBFM40 fuel map, proxied and cached. LANDFIRE's firewall rejects
    # some browsers (headless Chrome); the server fetches with an honest user agent.
    # Needs viewer/deploy/nginx-vr_fire-cache.conf in /etc/nginx/conf.d/.
    location = /vr_fire/fuel {
        limit_except GET { deny all; }
        proxy_pass https://lfps.usgs.gov/arcgis/rest/services/Landfire_LF2025/LF2025_FBFM40_CONUS/ImageServer/exportImage;
        proxy_ssl_server_name on;
        proxy_set_header Host lfps.usgs.gov;
        proxy_set_header User-Agent "vr_fire/1.0 (+https://chilos.dev/vr_fire/)";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
        proxy_cache vr_fire_fuel;
        proxy_cache_valid 200 30d;
        proxy_read_timeout 30s;
        add_header X-Cache $upstream_cache_status;
    }
