[package]
name = "viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
vr_fire = { path = "..", default-features = false }
tiff = "0.11"
ehttp = "0.7"
ewebsock = "0.8"
web-time = "1.1"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
zune-jpeg = "0.5.15"

[features]
webgpu = ["bevy/webgpu"]
