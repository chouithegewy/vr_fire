[package]
name = "vr_fire"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["viewer", "relay", "compress-lab", "hires", "bench/bevy"]

[features]
default = ["pipeline"]
# Download/ingest/bake (HTTP client, thread pool, CLI). Off for the wasm viewer,
# which only needs the grid and projection code.
pipeline = ["dep:clap", "dep:rayon", "dep:ureq"]

[[bin]]
name = "vr_fire"
required-features = ["pipeline"]

[dependencies]
anyhow = "1.0.104"
brotli = "9"
flate2 = "1.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }
proj4rs = { version = "0.2", default-features = false }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiff = "0.11"
ureq = { version = "3", optional = true }
weezl = "0.1"

[dev-dependencies]
gltf = "1.4"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
