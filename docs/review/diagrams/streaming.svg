<svg role="img" aria-labelledby="streaming-title streaming-desc" width="1325pt" height="818pt"
 viewBox="0.00 0.00 1325.00 818.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="streaming-title">Viewer streaming &amp; rendering</title><desc id="streaming-desc">Runtime identities connect patch jobs, CPU heights, ECS entities and image mosaics. All entities here are in memory. Patch is a value key (Super, Tile or Hires), not a database row. A job uses either packed bytes or the COG block dependency list; the optional many-to-many COG dependency is shown. Built and Job reference the same patch address at different lifecycle stages. Cardinalities describe a single viewer instance.</desc>
