<svg role="img" aria-labelledby="services-title services-desc" width="1070pt" height="863pt"
 viewBox="0.00 0.00 1070.00 863.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="services-title">Multiplayer sessions &amp; lidar cache</title><desc id="services-desc">Two independent services: transient player state with an event log, and cached lidar products. Player IDs are process-local and restart at 1. JSONL event IDs are historical references, not globally unique foreign keys. Event (the in-memory recent view) drops the id/name fields stored in JSONL and retains only the last 60 entries. The lidar quota has no persistent entity today (F09). The two services have no code-level data relationship.</desc>
