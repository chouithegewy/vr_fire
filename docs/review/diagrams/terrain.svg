<svg role="img" aria-labelledby="terrain-title terrain-desc" width="1340pt" height="663pt"
 viewBox="0.00 0.00 1340.00 663.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="terrain-title">Terrain persistence &amp; provenance</title><desc id="terrain-desc">JSON and GeoTIFF are the authoritative store; meshes and VRH patches are derived outputs. Cardinalities describe logical products of a successful run; they are not database constraints. Sources are stored as a string array, not a join table. A packed patch can read several tiles for its border ring or super-tile footprint. Old files may violate the intended current-output relationship (F07). Bake has four LODs; packed grid patches have five, plus a separate super level.</desc>
